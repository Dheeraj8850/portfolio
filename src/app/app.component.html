<header>
  <nav>
    <div class="logo">
      <span>D</span>
    </div>

    <div class="nav-links">
      <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        <span>Home</span>
      </a>
      <a routerLink="/about" routerLinkActive="active" class="nav-link">
        <span>About</span>
      </a>
      <a routerLink="/projects" routerLinkActive="active" class="nav-link">
        <span>Projects</span>
      </a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link">
        <span>Contact</span>
      </a>
    </div>

    <div class="mobile-menu-btn" (click)="toggleMenu()">
      <div class="hamburger" [class.active]="isMenuOpen"></div>
    </div>
  </nav>

  <!-- Fullscreen Mobile Menu -->
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <button class="close-btn" (click)="closeMenu()">&times;</button>
    <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
      <span>Home</span>
    </a>
    <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">
      <span>About</span>
    </a>
    <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">
      <span>Projects</span>
    </a>
    <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">
      <span>Contact</span>
    </a>
  </div>
</header>

<main [@routeAnimations]="prepareRoute(outlet)">
  <router-outlet #outlet="outlet"></router-outlet>
</main>
